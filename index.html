<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow | مدیریت هوشمند تسک‌ها</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    body { 
      font-family: 'Vazirmatn', sans-serif; 
      user-select: none; 
      -webkit-user-select: none; 
    }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
    .drop-zone-active { border-color: #6366f1 !important; background-color: rgba(99, 102, 241, 0.15) !important; }
    .dragging { opacity: 0.4; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

  <div class="max-w-6xl mx-auto px-4 py-6 space-y-8">
    
    <!-- هدر -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Task Flow</h1>
      <span class="text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800" id="current-date-text">--/--/--</span>
    </header>

    <!-- ورودی سریع (Quick Add) به همراه انتخاب تاریخ -->
    <section class="glass p-4 rounded-2xl border border-slate-800 shadow-xl space-y-3">
      <form id="quick-add-form" class="flex flex-col sm:flex-row gap-2">
        <input 
          type="text" 
          id="task-input" 
          placeholder="افزودن تسک جدید (اینتر بزنید)..." 
          required 
          class="flex-1 bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition placeholder-slate-500 select-text"
        >
        <div class="flex gap-2">
          <input 
            type="date" 
            id="task-date-input" 
            class="bg-slate-900/80 border border-slate-700/60 text-slate-300 rounded-xl px-3 py-3 text-xs focus:outline-none focus:border-indigo-500 transition"
          >
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition whitespace-nowrap">
            افزودن
          </button>
        </div>
      </form>
    </section>

    <!-- برنامه‌ریزی روزانه با انتخاب تاریخ -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/40 p-3 rounded-2xl border border-slate-800">
        <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400"></span> برنامه‌ریزی روزانه
        </h2>
        
        <!-- انتخابگر تاریخ مشاهده -->
        <div class="flex items-center gap-2">
          <label for="view-date-picker" class="text-xs text-slate-400">تاریخ برنامه:</label>
          <input 
            type="date" 
            id="view-date-picker" 
            class="bg-slate-950 border border-slate-700/80 text-cyan-400 font-medium rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-cyan-500"
          >
          <button id="today-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition">امروز</button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- صبح -->
        <div class="glass border border-slate-800/80 rounded-2xl p-4 flex flex-col space-y-3">
          <div class="flex justify-between items-center pb-2 border-b border-slate-800">
            <span class="font-medium text-amber-400 text-sm">🌅 صبح</span>
            <span class="text-xs bg-amber-400/10 text-amber-400 px-2 py-0.5 rounded" id="count-morning">0</span>
          </div>
          <div id="slot-morning" data-zone="morning" class="drop-target space-y-2 min-h-[120px] flex-1 rounded-xl p-1 transition border border-transparent"></div>
        </div>

        <!-- ظهر / عصر -->
        <div class="glass border border-slate-800/80 rounded-2xl p-4 flex flex-col space-y-3">
          <div class="flex justify-between items-center pb-2 border-b border-slate-800">
            <span class="font-medium text-orange-400 text-sm">☀️ ظهر و عصر</span>
            <span class="text-xs bg-orange-400/10 text-orange-400 px-2 py-0.5 rounded" id="count-afternoon">0</span>
          </div>
          <div id="slot-afternoon" data-zone="afternoon" class="drop-target space-y-2 min-h-[120px] flex-1 rounded-xl p-1 transition border border-transparent"></div>
        </div>

        <!-- شب -->
        <div class="glass border border-slate-800/80 rounded-2xl p-4 flex flex-col space-y-3">
          <div class="flex justify-between items-center pb-2 border-b border-slate-800">
            <span class="font-medium text-indigo-400 text-sm">🌙 شب</span>
            <span class="text-xs bg-indigo-400/10 text-indigo-400 px-2 py-0.5 rounded" id="count-evening">0</span>
          </div>
          <div id="slot-evening" data-zone="evening" class="drop-target space-y-2 min-h-[120px] flex-1 rounded-xl p-1 transition border border-transparent"></div>
        </div>
      </div>
    </section>

    <!-- ماتریس آیزنهاور -->
    <section class="space-y-4">
      <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-indigo-400"></span> ماتریس آیزنهاور (تسک‌های بدون زمان)
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <div class="bg-red-950/20 border border-red-900/30 rounded-2xl p-4 space-y-3">
          <span class="text-xs font-semibold text-red-400 tracking-wide uppercase">🔥 فوری و مهم</span>
          <div id="matrix-do" data-zone="matrix-do" class="drop-target space-y-2 min-h-[80px] rounded-xl p-1 transition"></div>
        </div>

        <div class="bg-blue-950/20 border border-blue-900/30 rounded-2xl p-4 space-y-3">
          <span class="text-xs font-semibold text-blue-400 tracking-wide uppercase">📅 غیرفوری و مهم</span>
          <div id="matrix-schedule" data-zone="matrix-schedule" class="drop-target space-y-2 min-h-[80px] rounded-xl p-1 transition"></div>
        </div>

        <div class="bg-amber-950/20 border border-amber-900/30 rounded-2xl p-4 space-y-3">
          <span class="text-xs font-semibold text-amber-400 tracking-wide uppercase">⚡ فوری و غیرمهم</span>
          <div id="matrix-delegate" data-zone="matrix-delegate" class="drop-target space-y-2 min-h-[80px] rounded-xl p-1 transition"></div>
        </div>

        <!-- ورودی اولیه تسک‌های جدید مستقیم به اینجا می‌آید -->
        <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-4 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-slate-400 tracking-wide uppercase">🗑️ غیرفوری و غیرمهم (ورودی اولیه)</span>
          </div>
          <div id="matrix-eliminate" data-zone="matrix-eliminate" class="drop-target space-y-2 min-h-[80px] rounded-xl p-1 transition"></div>
        </div>

      </div>
    </section>

  </div>

  <script>
    const SUPABASE_URL = 'https://qtknpxwjzqgwueuwivga.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0a25weHdqenFnd3VldXdpdmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM4ODgsImV4cCI6MjEwMjU0OTg4OH0.GNGDRuH_dqqgD_oi7b2ZdYgcNGzbMxL8Iu3sX_r9BfQ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // تنظیم تاریخ امروز به فرمت YYYY-MM-DD
    const getTodayString = () => new Date().toISOString().split('T')[0];
    
    let activeViewDate = getTodayString();
    let allTasks = [];
    let draggedTaskId = null;

    // مقداردهی اولیه تاریخ‌ها
    document.getElementById('current-date-text').innerText = new Date().toLocaleDateString('fa-IR');
    document.getElementById('task-date-input').value = getTodayString();
    const viewDatePicker = document.getElementById('view-date-picker');
    viewDatePicker.value = activeViewDate;

    // تغییر تاریخ مشاهده برنامه روزانه
    viewDatePicker.addEventListener('change', (e) => {
      activeViewDate = e.target.value;
      renderTasks();
    });

    document.getElementById('today-btn').addEventListener('click', () => {
      activeViewDate = getTodayString();
      viewDatePicker.value = activeViewDate;
      renderTasks();
    });

    // دریافت اطلاعات
    async function fetchTasks() {
      const { data, error } = await _supabase
        .from('tasks')
        .select('*')
        .order('created_at', { ascending: false });

      if (!error) {
        allTasks = data;
        renderTasks();
      }
    }

    // افزودن تسک جدید
    document.getElementById('quick-add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const dateInput = document.getElementById('task-date-input');
      const title = input.value.trim();
      const task_date = dateInput.value || getTodayString();

      if (!title) return;

      // پیش‌فرض: غیرمهم، غیرفوری و زمان‌بندی نشده (backlog)
      const { error } = await _supabase
        .from('tasks')
        .insert([{ 
          title, 
          is_important: false, 
          is_urgent: false, 
          time_slot: 'backlog',
          task_date: task_date
        }]);

      if (!error) {
        input.value = '';
        fetchTasks();
      }
    });

    async function updateTask(id, fields) {
      await _supabase.from('tasks').update(fields).eq('id', id);
      fetchTasks();
    }

    async function deleteTask(id) {
      await _supabase.from('tasks').delete().eq('id', id);
      fetchTasks();
    }

    function renderTasks() {
      const containers = ['slot-morning', 'slot-afternoon', 'slot-evening', 'matrix-do', 'matrix-schedule', 'matrix-delegate', 'matrix-eliminate'];
      containers.forEach(id => document.getElementById(id).innerHTML = '');

      let counts = { morning: 0, afternoon: 0, evening: 0 };

      allTasks.forEach(task => {
        const card = createCard(task);
        const taskDate = task.task_date ? task.task_date.split('T')[0] : null;

        // ۱. اگر زمان‌بندی دارد (صبح/ظهر/شب) و تاریخش با تاریخ فعالِ برنامه‌ریز یکسان است
        if (task.time_slot !== 'backlog') {
          if (taskDate === activeViewDate) {
            const container = document.getElementById(`slot-${task.time_slot}`);
            if (container) {
              container.appendChild(card);
              counts[task.time_slot]++;
            }
          }
        } 
        // ۲. اگر زمان‌بندی نشده است -> در ماتریس آیزنهاور قرار بگیرد
        else {
          if (task.is_important && task.is_urgent) document.getElementById('matrix-do').appendChild(card);
          else if (task.is_important && !task.is_urgent) document.getElementById('matrix-schedule').appendChild(card);
          else if (!task.is_important && task.is_urgent) document.getElementById('matrix-delegate').appendChild(card);
          else document.getElementById('matrix-eliminate').appendChild(card); // ورودی اولیه‌ها اینجا می‌روند
        }
      });

      document.getElementById('count-morning').innerText = counts.morning;
      document.getElementById('count-afternoon').innerText = counts.afternoon;
      document.getElementById('count-evening').innerText = counts.evening;

      setupDragAndDrop();
    }

    function createCard(task) {
      const card = document.createElement('div');
      card.draggable = true;
      card.dataset.id = task.id;
      card.className = `p-3 bg-slate-900 border ${task.is_completed ? 'border-emerald-900/40 opacity-50' : 'border-slate-800'} rounded-xl space-y-2 shadow-sm text-xs cursor-grab active:cursor-grabbing transition`;

      const formattedDate = task.task_date ? new Date(task.task_date).toLocaleDateString('fa-IR', {month: 'numeric', day: 'numeric'}) : '';

      card.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <span class="${task.is_completed ? 'line-through text-slate-500' : 'text-slate-200 font-medium'} flex-1 pointer-events-none">${task.title}</span>
          <button onclick="deleteTask('${task.id}')" class="text-slate-600 hover:text-red-400 transition px-1">✕</button>
        </div>
        <div class="flex items-center justify-between pt-1 border-t border-slate-800/80 text-[10px] text-slate-500">
          <span>📅 ${formattedDate}</span>
          <input 
            type="date" 
            value="${task.task_date ? task.task_date.split('T')[0] : ''}" 
            onchange="updateTask('${task.id}', {task_date: this.value})"
            class="bg-slate-950 border border-slate-800 text-slate-400 rounded px-1 py-0.5 text-[10px] focus:outline-none"
          >
        </div>
      `;
      return card;
    }

    // منطق Drag and Drop
    function setupDragAndDrop() {
      const cards = document.querySelectorAll('[draggable="true"]');
      const dropTargets = document.querySelectorAll('.drop-target');

      cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
          draggedTaskId = card.dataset.id;
          card.classList.add('dragging');
          e.dataTransfer.setData('text/plain', card.dataset.id);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
        });
      });

      dropTargets.forEach(target => {
        target.addEventListener('dragover', (e) => {
          e.preventDefault();
          target.classList.add('drop-zone-active');
        });

        target.addEventListener('dragleave', () => {
          target.classList.remove('drop-zone-active');
        });

        target.addEventListener('drop', async (e) => {
          e.preventDefault();
          target.classList.remove('drop-zone-active');
          const zone = target.dataset.zone;
          if (!draggedTaskId || !zone) return;

          let updates = {};

          // اگر تسک افتاد توی برنامه‌ریزی روزانه -> زمان‌بندی شده و تاریخش می‌شود همان تاریخ فعالِ تقویم
          if (['morning', 'afternoon', 'evening'].includes(zone)) {
            updates = { time_slot: zone, task_date: activeViewDate };
          } 
          // اگر افتاد توی خانه غیرمهم/غیرفوری
          else if (zone === 'matrix-eliminate') {
            updates = { time_slot: 'backlog', is_important: false, is_urgent: false };
          } 
          // اگر افتاد در سایر خانه‌های ماتریس
          else if (zone === 'matrix-do') {
            updates = { time_slot: 'backlog', is_important: true, is_urgent: true };
          } else if (zone === 'matrix-schedule') {
            updates = { time_slot: 'backlog', is_important: true, is_urgent: false };
          } else if (zone === 'matrix-delegate') {
            updates = { time_slot: 'backlog', is_important: false, is_urgent: true };
          }

          await updateTask(draggedTaskId, updates);
          draggedTaskId = null;
        });
      });
    }

    fetchTasks();
  </script>
</body>
</html>
