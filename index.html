<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow | مدیریت تسک‌ها</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

  <div class="max-w-6xl mx-auto px-4 py-6 space-y-8">
    
    <!-- هدر -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Task Flow</h1>
      <span class="text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800" id="current-date">--/--/--</span>
    </header>

    <!-- ورودی سریع (Quick Add) -->
    <section class="glass p-4 rounded-2xl border border-slate-800 shadow-xl">
      <form id="quick-add-form" class="flex gap-2">
        <input 
          type="text" 
          id="task-input" 
          placeholder="افزودن سریع تسک جدید (اینتر بزنید)..." 
          required 
          class="flex-1 bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition placeholder-slate-500"
        >
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition flex items-center gap-1">
          <span>افزودن</span>
        </button>
      </form>
    </section>

    <!-- لیست کلی تسک‌ها (ورودی‌های جدید / بک‌لاگ) -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> ورودی‌های جدید (لیست کلی تسک‌ها)
        </h2>
        <span class="text-xs bg-emerald-400/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20" id="count-backlog">0 تسک</span>
      </div>
      <div id="slot-backlog" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 min-h-[60px] p-3 bg-slate-900/30 border border-slate-800/60 rounded-2xl"></div>
    </section>

    <hr class="border-slate-800/80">

    <!-- برنامه‌ریزی سه زونه روز -->
    <section class="space-y-4">
      <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-cyan-400"></span> برنامه‌ریزی امروز
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- صبح -->
        <div class="glass border border-slate-800/80 rounded-2xl p-4 flex flex-col space-y-3">
          <div class="flex justify-between items-center pb-2 border-b border-slate-800">
            <span class="font-medium text-amber-400 text-sm">🌅 صبح</span>
            <span class="text-xs bg-amber-400/10 text-amber-400 px-2 py-0.5 rounded" id="count-morning">0</span>
          </div>
          <div id="slot-morning" class="space-y-2 min-h-[100px] flex-1"></div>
        </div>

        <!-- ظهر / عصر -->
        <div class="glass border border-slate-800/80 rounded-2xl p-4 flex flex-col space-y-3">
          <div class="flex justify-between items-center pb-2 border-b border-slate-800">
            <span class="font-medium text-orange-400 text-sm">☀️ ظهر و عصر</span>
            <span class="text-xs bg-orange-400/10 text-orange-400 px-2 py-0.5 rounded" id="count-afternoon">0</span>
          </div>
          <div id="slot-afternoon" class="space-y-2 min-h-[100px] flex-1"></div>
        </div>

        <!-- شب -->
        <div class="glass border border-slate-800/80 rounded-2xl p-4 flex flex-col space-y-3">
          <div class="flex justify-between items-center pb-2 border-b border-slate-800">
            <span class="font-medium text-indigo-400 text-sm">🌙 شب</span>
            <span class="text-xs bg-indigo-400/10 text-indigo-400 px-2 py-0.5 rounded" id="count-evening">0</span>
          </div>
          <div id="slot-evening" class="space-y-2 min-h-[100px] flex-1"></div>
        </div>

      </div>
    </section>

    <!-- ماتریس آیزنهاور -->
    <section class="space-y-4">
      <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-indigo-400"></span> ماتریس آیزنهاور (اولویت‌بندی)
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <div class="bg-red-950/20 border border-red-900/30 rounded-2xl p-4 space-y-3">
          <span class="text-xs font-semibold text-red-400 tracking-wide uppercase">🔥 فوری و مهم (انجام بده)</span>
          <div id="matrix-do" class="space-y-2 min-h-[60px]"></div>
        </div>

        <div class="bg-blue-950/20 border border-blue-900/30 rounded-2xl p-4 space-y-3">
          <span class="text-xs font-semibold text-blue-400 tracking-wide uppercase">📅 غیرفوری و مهم (برنامه‌ریزی کن)</span>
          <div id="matrix-schedule" class="space-y-2 min-h-[60px]"></div>
        </div>

        <div class="bg-amber-950/20 border border-amber-900/30 rounded-2xl p-4 space-y-3">
          <span class="text-xs font-semibold text-amber-400 tracking-wide uppercase">⚡ فوری و غیرمهم (واگذار کن / سریع بزن)</span>
          <div id="matrix-delegate" class="space-y-2 min-h-[60px]"></div>
        </div>

        <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-4 space-y-3">
          <span class="text-xs font-semibold text-slate-400 tracking-wide uppercase">🗑️ غیرفوری و غیرمهم (حذف یا بررسی)</span>
          <div id="matrix-eliminate" class="space-y-2 min-h-[60px]"></div>
        </div>

      </div>
    </section>

  </div>

  <script>
    // اطلاعات Supabase را اینجا بگذار
    const SUPABASE_URL = 'https://qtknpxwjzqgwueuwivga.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_O-zr9SEbHlRyPyFrBKa0wg_xTEzknx1';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('current-date').innerText = new Date().toLocaleDateString('fa-IR');

    let allTasks = [];

    // دریافت تسک‌ها
    async function fetchTasks() {
      const { data, error } = await _supabase
        .from('tasks')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("خطا در دریافت اطلاعات:", error.message);
      } else {
        allTasks = data;
        renderTasks();
      }
    }

    // افزودن تسک جدید
    document.getElementById('quick-add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const title = input.value.trim();
      if (!title) return;

      const { data, error } = await _supabase
        .from('tasks')
        .insert([{ title: title, is_important: false, is_urgent: false, time_slot: 'backlog' }]);

      if (error) {
        alert("خطا در ثبت تسک! مطمئن شوید کلید Anon را درست وارد کرده‌اید.");
        console.error(error);
      } else {
        input.value = '';
        fetchTasks();
      }
    });

    // آپدیت تسک
    async function updateTask(id, fields) {
      const { error } = await _supabase.from('tasks').update(fields).eq('id', id);
      if (error) console.error(error);
      else fetchTasks();
    }

    // حذف تسک
    async function deleteTask(id) {
      const { error } = await _supabase.from('tasks').delete().eq('id', id);
      if (error) console.error(error);
      else fetchTasks();
    }

    // رندر بخش‌ها
    function renderTasks() {
      const containers = ['slot-backlog', 'slot-morning', 'slot-afternoon', 'slot-evening', 'matrix-do', 'matrix-schedule', 'matrix-delegate', 'matrix-eliminate'];
      containers.forEach(id => document.getElementById(id).innerHTML = '');

      let counts = { backlog: 0, morning: 0, afternoon: 0, evening: 0 };

      allTasks.forEach(task => {
        const card = createCard(task);

        // ۱. اگر زمان‌بندی شده (صبح/ظهر/شب)
        if (task.time_slot !== 'backlog') {
          document.getElementById(`slot-${task.time_slot}`).appendChild(card);
          counts[task.time_slot]++;
        } 
        // ۲. اگر زمان‌بندی نشده اما مهم یا فوری شده -> در ماتریس قرار بگیرد
        else if (task.is_important || task.is_urgent) {
          if (task.is_important && task.is_urgent) document.getElementById('matrix-do').appendChild(card);
          else if (task.is_important && !task.is_urgent) document.getElementById('matrix-schedule').appendChild(card);
          else if (!task.is_important && task.is_urgent) document.getElementById('matrix-delegate').appendChild(card);
        }
        // ۳. در غیر این صورت -> در لیست ورودی‌های جدید (Backlog) نمایش بده
        else {
          document.getElementById('slot-backlog').appendChild(card);
          counts.backlog++;
        }
      });

      document.getElementById('count-backlog').innerText = `${counts.backlog} تسک`;
      document.getElementById('count-morning').innerText = counts.morning;
      document.getElementById('count-afternoon').innerText = counts.afternoon;
      document.getElementById('count-evening').innerText = counts.evening;
    }

    // ساخت کارت تسک
    function createCard(task) {
      const card = document.createElement('div');
      card.className = `p-3 bg-slate-900 border ${task.is_completed ? 'border-emerald-900/40 opacity-50' : 'border-slate-800'} rounded-xl space-y-2 shadow-sm text-xs`;

      card.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <span class="${task.is_completed ? 'line-through text-slate-500' : 'text-slate-200 font-medium'} flex-1">${task.title}</span>
          <button onclick="deleteTask('${task.id}')" class="text-slate-600 hover:text-red-400 transition px-1">✕</button>
        </div>
        
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 gap-1 flex-wrap">
          <div class="flex gap-1">
            <button onclick="updateTask('${task.id}', {is_important: ${!task.is_important}})" class="px-2 py-0.5 rounded border ${task.is_important ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'border-slate-800 text-slate-500'}">مهم</button>
            <button onclick="updateTask('${task.id}', {is_urgent: ${!task.is_urgent}})" class="px-2 py-0.5 rounded border ${task.is_urgent ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'border-slate-800 text-slate-500'}">فوری</button>
          </div>

          <select onchange="updateTask('${task.id}', {time_slot: this.value})" class="bg-slate-950 border border-slate-800 text-slate-300 text-[11px] rounded px-1.5 py-0.5 focus:outline-none">
            <option value="backlog" ${task.time_slot === 'backlog' ? 'selected' : ''}>— بک‌لاگ —</option>
            <option value="morning" ${task.time_slot === 'morning' ? 'selected' : ''}>🌅 صبح</option>
            <option value="afternoon" ${task.time_slot === 'afternoon' ? 'selected' : ''}>☀️ ظهر</option>
            <option value="evening" ${task.time_slot === 'evening' ? 'selected' : ''}>🌙 شب</option>
          </select>
        </div>
      `;
      return card;
    }

    fetchTasks();
  </script>
</body>
</html>
